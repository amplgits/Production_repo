<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Morning · Production</title>
<meta name="description" content="Daily excavator production across all sites, from the combined Good Morning report.">
<meta name="theme-color" content="#F5F1EA">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23F5A524'/%3E%3Cstop offset='1' stop-color='%23E8552D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%231F3340'/%3E%3Ccircle cx='32' cy='38' r='13' fill='url(%23a)'/%3E%3Cpath d='M6 40h14v6h12v6h14v-6h12v12H6z' fill='%23FFF6E8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* =====================================================================
   Design tokens. One light source (top-left), so every shadow falls down-right.
   Gradients are accents only: hero KPI, active states, chart fills, the brand mark.
   ===================================================================== */
:root{
  --paper:#F5F1EA; --paper-2:#EDE6DA; --card:#FFFDF9; --card-2:#FBF7F0;
  --ink:#1E1B16; --ink-2:#4A443B; --muted:#7D7466; --faint:#A79E90; --line:#E6DDCE; --line-2:#D8CDBA;
  --night:#1F3340; --night-2:#2C4A5A;
  --dawn-1:#F5A524; --dawn-2:#E8552D; --dawn:linear-gradient(135deg,var(--dawn-1) 0%,var(--dawn-2) 100%);
  --dawn-soft:linear-gradient(135deg,#FFF1D6 0%,#FFE1D2 100%);
  --dusk:linear-gradient(135deg,#2C4A5A 0%,#1F3340 100%);
  --good:#0E8A3C; --good-bg:#E5F4EA; --warn:#B26A00; --warn-bg:#FFF2DA; --bad:#C8352B; --bad-bg:#FCE7E4; --info-bg:#E8EEF2;
  /* sequential achievement scale (one hue, light → dark) */
  --s0:#FBEFE6; --s1:#F8D9C2; --s2:#F2B48C; --s3:#E98A57; --s4:#D4612E; --s5:#A8441D;
  --f-display:'Bricolage Grotesque', ui-serif, Georgia, serif;
  --f-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-sm:10px; --r:16px; --r-lg:22px;
  --sh-1:1px 1px 0 rgba(255,255,255,.7) inset, 1px 2px 3px rgba(60,40,10,.06), 2px 6px 14px rgba(60,40,10,.06);
  --sh-2:1px 1px 0 rgba(255,255,255,.8) inset, 2px 4px 8px rgba(60,40,10,.07), 6px 16px 34px rgba(60,40,10,.10);
  --sh-3:3px 8px 18px rgba(60,40,10,.12), 12px 30px 60px rgba(60,40,10,.16);
  --sh-press:inset 1px 2px 4px rgba(60,40,10,.18);
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);background-image:radial-gradient(1200px 500px at 85% -10%,#FFE9CF 0%,rgba(255,233,207,0) 60%),radial-gradient(900px 400px at -10% 0%,#EAF0F2 0%,rgba(234,240,242,0) 55%);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--dawn-2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- tactile controls ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:linear-gradient(180deg,#FFFFFF 0%,#F6F0E6 100%);box-shadow:var(--sh-1);font-weight:600;font-size:14px;cursor:pointer;transition:transform .25s var(--spring),box-shadow .2s var(--out),background .2s;white-space:nowrap;-webkit-tap-highlight-color:transparent;user-select:none}
.btn:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.975);box-shadow:var(--sh-press);transition-duration:.06s}
.btn.primary{border-color:transparent;color:#fff;background:var(--dawn);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,2px 4px 10px rgba(232,85,45,.28),4px 12px 26px rgba(232,85,45,.22);text-shadow:0 1px 0 rgba(120,40,10,.25)}
.btn.primary:active{box-shadow:inset 1px 2px 5px rgba(120,30,0,.35)}
.btn.dark{border-color:transparent;color:#FFF6E8;background:var(--dusk)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--card-2)}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn[disabled]{opacity:.5;pointer-events:none}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.18;pointer-events:none;animation:ripple .55s var(--out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(245,241,234,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;text-decoration:none;color:inherit;min-width:0}
.brand svg{width:40px;height:40px;filter:drop-shadow(2px 4px 6px rgba(31,51,64,.25))}
.brand b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.05}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.datebox{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:3px;box-shadow:var(--sh-1)}
.datebox select{border:0;background:transparent;font-weight:600;height:34px;padding:0 6px;cursor:pointer;max-width:190px}
.datebox .btn{height:34px;width:34px;border-radius:10px;box-shadow:none;border-color:transparent;background:transparent}
.datebox .btn:hover{background:var(--paper-2)}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.on i{background:var(--good);box-shadow:0 0 0 3px rgba(14,138,60,.15)}
.conn.off i{background:var(--bad)}

/* ---------- site rail ---------- */
.rail{max-width:1360px;margin:0 auto;padding:14px 24px 0}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 10px;scroll-snap-type:x proximity}
.pills::-webkit-scrollbar{display:none}
.pill{position:relative;overflow:hidden;flex-shrink:0;scroll-snap-align:start;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);box-shadow:var(--sh-1);cursor:pointer;font-weight:600;font-size:13.5px;transition:transform .3s var(--spring),box-shadow .2s,background .2s,color .2s;-webkit-tap-highlight-color:transparent}
.pill:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.pill:active{transform:scale(.96);box-shadow:var(--sh-press)}
.pill[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--dusk);box-shadow:2px 5px 14px rgba(31,51,64,.28)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill small{font-weight:600;font-size:11.5px;color:var(--muted)}
.pill[aria-pressed="true"] small{color:#F9D9A8}

/* ---------- page + grid (deliberately asymmetric) ---------- */
main{max-width:1360px;margin:0 auto;padding:8px 24px 64px}
.head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:6px 0 18px}
.head h1{margin:0;font-size:clamp(26px,3.2vw,38px);font-weight:700;line-height:1.05}
.head h1 em{font-style:normal;background:var(--dawn);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:70ch}
.head .grow{flex:1;min-width:240px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.info{background:var(--info-bg);color:var(--night-2)}
.tag svg.i{width:13px;height:13px}

.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:20px 22px;min-width:0;transform-style:preserve-3d;transition:transform .5s var(--spring),box-shadow .3s var(--out);will-change:transform}
.card.tilt:hover{box-shadow:var(--sh-3)}
.card h2{margin:0;font-size:18px;font-weight:650;font-weight:600;line-height:1.25}
.card .kick{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.card .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-h .grow{flex:1;min-width:0}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-12{grid-column:span 12}.span-6{grid-column:span 6}
.stagger{opacity:0;transform:translateY(14px) scale(.985);animation:in .7s var(--out) forwards;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes in{to{opacity:1;transform:none}}

/* hero KPI */
.hero{grid-column:span 7;padding:26px 28px;overflow:hidden;background:linear-gradient(160deg,#FFFDF9 0%,#FFF6EA 100%)}
.hero::before{content:"";position:absolute;right:-90px;top:-120px;width:340px;height:340px;border-radius:50%;background:var(--dawn);opacity:.13;filter:blur(2px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--dawn)}
.hero .kick{color:var(--dawn-2)}
.hero .big{font-family:var(--f-display);font-size:clamp(46px,6.6vw,84px);font-weight:800;line-height:.95;letter-spacing:-.03em;margin:8px 0 2px}
.hero .big small{font-family:var(--f-body);font-size:18px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.hero .row{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;align-items:flex-end}
.hero .row .lab{font-size:12.5px;color:var(--muted)}
.hero .row .val{font-family:var(--f-display);font-size:22px;font-weight:700}
.meter{position:relative;height:14px;border-radius:99px;background:var(--paper-2);box-shadow:inset 1px 2px 3px rgba(60,40,10,.12);margin-top:18px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--dawn);width:0;transition:width 1.1s var(--out);box-shadow:1px 2px 6px rgba(232,85,45,.35)}
.meter b{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:2px}
.meter b::after{content:"Target";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--ink-2)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;border-radius:8px;padding:2px 8px}
.delta.up{color:var(--good);background:var(--good-bg)}.delta.down{color:var(--bad);background:var(--bad-bg)}.delta.flat{color:var(--muted);background:var(--paper-2)}

.stack{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kpi{padding:16px 18px}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .foot{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpi.wide{grid-column:span 2;display:flex;gap:16px;align-items:center}
.kpi.wide .grow{flex:1;min-width:0}

.chart{position:relative;height:300px}
.chart.tall{height:360px}.chart.short{height:240px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* heatmap */
.heat{overflow-x:auto;padding-bottom:4px}
.heat table{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:600;color:var(--muted);text-align:left;padding-right:8px;white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1}
.heat thead th{position:static;text-align:center;padding:0;font-size:11px;min-width:24px}
.heat td{width:26px;height:26px;border-radius:7px;text-align:center;font-size:10px;font-weight:600;color:transparent;transition:transform .25s var(--spring);cursor:default}
.heat td:hover{transform:scale(1.25);color:var(--ink);box-shadow:var(--sh-2);position:relative;z-index:2}
.heat td.nr{background:repeating-linear-gradient(45deg,#EFE7DA 0 4px,#E3D8C6 4px 7px)}
.heat td.nd{background:#F4EFE7;box-shadow:inset 0 0 0 1px var(--line)}
.heat td.sel{outline:2px solid var(--ink);outline-offset:1px}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.scale i{display:inline-block;width:22px;height:10px;border-radius:3px}

/* class performance rows */
.cls{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:10px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cls:last-child{border-bottom:0}
.cls .nm b{display:block;font-weight:600}
.cls .nm small{color:var(--muted);font-size:12px}
.bar{position:relative;height:8px;border-radius:99px;background:var(--paper-2);margin-top:5px;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--night-2);transition:width 1s var(--out)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--dawn-2)}
.mini{font-size:12px;color:var(--muted)}
.mini strong{font-family:var(--f-display);font-size:15px;color:var(--ink)}

/* reasons */
.reason{display:flex;align-items:center;gap:10px;padding:8px 0}
.reason .nm{flex:1;min-width:0;font-size:13.5px}
.reason .nm small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reason .hb{flex:1.2;height:10px;border-radius:99px;background:var(--paper-2);position:relative}
.reason .hb i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#F2B48C,#D4612E);transition:width 1s var(--out)}
.reason .hrs{font-family:var(--f-display);font-weight:700;min-width:64px;text-align:right}

/* remarks feed */
.feed{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding-right:4px}
.feed div{padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-size:13px}
.feed b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}

/* table */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--card-2);padding:0 12px 0 36px;box-shadow:inset 1px 2px 3px rgba(60,40,10,.06)}
.search svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.seg{display:inline-flex;background:var(--paper-2);border-radius:12px;padding:3px;gap:2px;box-shadow:inset 1px 2px 3px rgba(60,40,10,.08)}
.seg button{border:0;background:transparent;height:34px;padding:0 12px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2);transition:background .2s,box-shadow .2s,transform .2s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--sh-1);color:var(--ink)}
.seg button:active{transform:scale(.95)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{position:sticky;top:0;background:var(--card-2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.dt th.n,.dt td.n{text-align:right;font-variant-numeric:tabular-nums}
.dt th:hover{color:var(--ink)}
.dt td{padding:9px 12px;border-bottom:1px solid #F0E9DD;white-space:nowrap}
.dt td.wrap{white-space:normal;min-width:220px;color:var(--ink-2)}
.dt tbody tr{transition:background .15s}
.dt tbody tr:hover{background:#FFF8EC}
.pct{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pct i{display:inline-block;width:46px;height:6px;border-radius:9px;background:var(--paper-2);position:relative;overflow:hidden}
.pct i b{position:absolute;inset:0 auto 0 0;border-radius:9px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}

/* empty + skeleton */
.empty{max-width:640px;margin:40px auto;text-align:center;padding:10px}
.empty h2{font-size:clamp(26px,4vw,36px);margin:16px 0 8px}
.empty p{color:var(--ink-2);margin:0 auto 20px;max-width:52ch}
.empty .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;margin:24px 0}
.empty .steps div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh-1);font-size:13.5px}
.empty .steps b{display:block;font-family:var(--f-display);font-size:16px}
.sk{background:linear-gradient(90deg,#EFE8DC 0%,#F8F3EB 40%,#EFE8DC 80%);background-size:300% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-card{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);padding:20px}

/* modals */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(40,32,20,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
.scrim.open{display:flex;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:24px;box-shadow:var(--sh-3);border:1px solid var(--line);animation:pop .45s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
.m-h{display:flex;align-items:center;gap:12px;padding:20px 22px 0}
.m-h h2{margin:0;font-size:21px;flex:1}
.m-b{padding:16px 22px}
.m-f{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 20px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:13px}
.field input{height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--card-2);padding:0 12px;box-shadow:inset 1px 2px 3px rgba(60,40,10,.06)}
.field .help{font-size:12px;color:var(--muted)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 18px;border-radius:20px;border:2px dashed var(--line-2);background:var(--card-2);cursor:pointer;transition:border-color .2s,background .2s,transform .35s var(--spring)}
.drop:hover,.drop.over{border-color:var(--dawn-2);background:#FFF5EA;transform:scale(1.01)}
.drop.over .bucket{transform:rotate(-14deg) translateY(4px)}
.drop svg.ill{width:150px;height:110px}
.bucket{transform-origin:118px 22px;transition:transform .5s var(--spring)}
.drop b{font-family:var(--f-display);font-size:18px}
.drop span{color:var(--muted);font-size:13px}
.prog{height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden;box-shadow:inset 1px 2px 3px rgba(60,40,10,.1);margin-top:14px}
.prog i{display:block;height:100%;width:0;background:var(--dawn);border-radius:99px;transition:width .35s var(--out)}
.status{font-size:13.5px;margin-top:10px;min-height:20px}
.status.err{color:var(--bad);font-weight:600}
.preview{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card-2)}
.preview .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.issues{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.issues li{display:flex;gap:8px;font-size:12.5px;align-items:flex-start}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 0}
.done svg{width:74px;height:74px}
.done circle{stroke-dasharray:190;stroke-dashoffset:190;animation:draw .7s var(--out) forwards}
.done path{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .45s .45s var(--out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,24px);opacity:0;z-index:90;background:var(--card);border:1px solid var(--line-2);border-left:4px solid var(--dawn-2);box-shadow:var(--sh-3);border-radius:14px;padding:11px 16px;font-weight:600;font-size:13.5px;transition:all .45s var(--spring);max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-left-color:var(--bad)}

/* responsive */
@media (max-width:1100px){.hero,.stack{grid-column:span 12}.span-7,.span-5,.span-8,.span-4,.span-6{grid-column:span 12}}
@media (max-width:640px){
  .top-in{padding:10px 14px;gap:10px}.rail{padding:10px 14px 0}main{padding:6px 14px 48px}
  .brand small{display:none}.top .lbl{display:none}.top .btn{padding:0 12px}
  .datebox{order:5;width:100%;justify-content:space-between}.datebox select{flex:1;max-width:none}
  .stack{grid-template-columns:1fr 1fr;gap:12px}.kpi.wide{grid-column:span 2}.kpi .val{font-size:24px}
  .bento{gap:12px}.card{padding:16px}.hero{padding:20px}
  .cls{grid-template-columns:1fr 1fr}.cls .nm{grid-column:span 2}
  .empty .steps{grid-template-columns:1fr}
  .chart{height:260px}.chart.tall{height:300px}
}
@media (max-width:380px){.stack{grid-template-columns:1fr}.kpi.wide{grid-column:span 1;flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}.stagger{opacity:1;transform:none}}
</style>

<script>
/* ============================================================================
   Good Morning combined-report parser
   Reads the "Good Morning – Up to DD-MM-YY" workbook: one sheet, one block of
   columns per site placed side by side, three header rows, one row per day,
   then "Avg./Day", "Total" and "Note" footer rows.
   Every value returned is copied from a cell; derived values (sums, ratios)
   are computed only from those cells and are labelled as such in the UI.
   ========================================================================== */
var GMParser = (function () {
  'use strict';

  function ValidationError(msg) { this.name = 'ValidationError'; this.message = msg; }
  ValidationError.prototype = Object.create(Error.prototype);

  var RX = {
    running: /run+ing\s*equip/i,
    hrs: /wr\.?\s*\/?\s*day/i,
    rate: /m\s*[³3]\s*\/\s*hr/i,
    perEx: /per\s*ex/i,
    target: /target/i,
    targeted: /targeted/i,
    achieved: /achieve\s*qty|total\s*achieve/i,
    pct: /%/,
    remark: /remark|reas(i)?on/i,
    date: /^date$/i,
    footer: /avg|total|note/i,
    cls: /\bEX[\s\-]?(\d{3})\b/i
  };

  function str(v) { return v == null ? '' : String(v).replace(/\s+/g, ' ').trim(); }
  function colName(c) { var s = ''; c++; while (c > 0) { var m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; }
  function cellRef(c, r) { return colName(c) + (r + 1); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function serialToISO(n) { var ms = Math.round((n - 25569) * 86400000); var d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function toISO(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate());
    if (typeof v === 'number') return v > 40000 && v < 60000 ? serialToISO(v) : null;
    var m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(str(v));
    if (m) { var y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }
    return null;
  }
  /* number from a cell: numbers pass; numeric text is converted; anything else is reported and treated as empty */
  function makeNum(issues) {
    var bad = {};
    function num(v, ref, site) {
      if (v == null || v === '') return null;
      if (typeof v === 'number') return isFinite(v) ? v : null;
      var s = str(v).replace(/,/g, '');
      if (s === '-' || s === '–') return null;
      if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
      var k = site + '|' + s; if (!bad[k]) { bad[k] = 1; issues.push({ level: 'warn', site: site, msg: 'Text "' + str(v) + '" in a number cell (' + ref + ') was treated as empty.' }); }
      return null;
    }
    return num;
  }
  function fileDate(name) {
    var m = /(\d{1,2})[\-_.](\d{1,2})[\-_.](\d{2,4})/.exec(String(name || ''));
    if (!m) return null; var y = +m[3]; if (y < 100) y += 2000;
    var d = y + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    return /^\d{4}-\d{2}-\d{2}$/.test(d) && +m[2] <= 12 && +m[1] <= 31 ? d : null;
  }
  function normClass(s) { var m = RX.cls.exec(str(s)); return m ? 'EX-' + m[1] : null; }
  function isText(v) { return typeof v === 'string' && str(v) !== ''; }

  /* ---------- locate the header row on a sheet ---------- */
  function findHeader(aoa) {
    for (var r = 0; r < Math.min(aoa.length, 40); r++) {
      var row = aoa[r] || [], run = 0, rate = 0;
      for (var c = 0; c < row.length; c++) { var t = str(row[c]); if (RX.running.test(t)) run++; if (RX.rate.test(t)) rate++; }
      if (run >= 1 && rate >= 1) return r;
    }
    return -1;
  }

  function parse(XLSX, wb, fileName) {
    var issues = [], num = makeNum(issues), sheetName = null, aoa = null, h = -1;
    for (var i = 0; i < wb.SheetNames.length; i++) {
      var a = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { header: 1, raw: true, defval: null, blankrows: true });
      var hr = findHeader(a);
      if (hr >= 2) { sheetName = wb.SheetNames[i]; aoa = a; h = hr; break; }
    }
    if (!aoa) throw new ValidationError('This doesn’t look like the Good Morning production report. No sheet has the header row with "Runing Equip", "Wr./ Day/Ex" and "M³/Hr." columns. Sheets found: ' + wb.SheetNames.join(', ') + '.');

    var H = aoa[h], R3 = aoa[h - 1] || [], R2 = aoa[h - 2] || [], width = 0;
    aoa.forEach(function (row) { if (row && row.length > width) width = row.length; });

    /* ---------- site blocks: each starts at a "Date" label ---------- */
    var starts = [];
    for (var c = 0; c < width; c++) if (RX.date.test(str(R3[c])) || RX.date.test(str(H[c]))) starts.push(c);
    if (!starts.length) throw new ValidationError('Found the header row (row ' + (h + 1) + ') but no "Date" column above it, so the site blocks can’t be located.');

    /* ---------- footer: first row whose first date cell is "Avg./Day", "Total" or "Note" ---------- */
    var end = aoa.length;
    for (var r = h + 1; r < aoa.length; r++) { var v0 = (aoa[r] || [])[starts[0]]; if (isText(v0) && RX.footer.test(str(v0))) { end = r; break; } }

    var sites = [];
    starts.forEach(function (start, bi) {
      var stop = bi + 1 < starts.length ? starts[bi + 1] - 1 : width - 1;
      var name = '';
      for (var k = start; k <= Math.min(stop, start + 2) && !name; k++) { var t = str(R2[k]); if (t && !/prod\.?\s*report/i.test(t) && !RX.cls.test(t)) name = t; }
      if (!name) { issues.push({ level: 'error', msg: 'The block starting at column ' + colName(start) + ' has no site name in row ' + (h - 1) + '; it was skipped.' }); return; }

      /* groups = one per "Runing Equip" column */
      var gStarts = [], siteCols = { targeted: -1, achieved: -1, pct: -1, remark: -1 };
      for (var c2 = start + 1; c2 <= stop; c2++) { if (RX.running.test(str(H[c2]))) gStarts.push(c2); }
      for (c2 = start + 1; c2 <= stop; c2++) { var t2 = str(H[c2]); if (RX.remark.test(t2)) siteCols.remark = c2; if (RX.targeted.test(t2) && siteCols.targeted < 0) siteCols.targeted = c2; }
      if (siteCols.targeted >= 0) for (c2 = siteCols.targeted + 1; c2 <= stop; c2++) { var t3 = str(H[c2]); if (siteCols.achieved < 0 && RX.achieved.test(t3)) siteCols.achieved = c2; else if (siteCols.pct < 0 && RX.pct.test(t3)) siteCols.pct = c2; }
      if (!gStarts.length) { issues.push({ level: 'error', site: name, msg: name + ': no "Runing Equip" column in its block, so it was skipped.' }); return; }

      var groups = gStarts.map(function (gs, gi) {
        var ge = gi + 1 < gStarts.length ? gStarts[gi + 1] - 1 : stop;
        [siteCols.targeted, siteCols.remark].forEach(function (x) { if (x > gs && x - 1 < ge) ge = x - 1; });
        var g = { start: gs, cols: { running: gs, hrs: -1, rate: -1, perEx: -1, target: -1, achieved: -1, pct: -1 }, name: null, targets: {} };
        for (var k = gs; k <= ge; k++) {
          var t = str(H[k]); if (!t) continue;
          if (k === gs) continue;
          if (RX.hrs.test(t) && g.cols.hrs < 0) g.cols.hrs = k;
          else if (RX.rate.test(t) && g.cols.rate < 0) g.cols.rate = k;
          else if (RX.perEx.test(t) && g.cols.perEx < 0) g.cols.perEx = k;
          else if (RX.target.test(t) && g.cols.target < 0) g.cols.target = k;
          else if (RX.achieved.test(t) && g.cols.achieved < 0) g.cols.achieved = k;
          else if (RX.pct.test(t) && g.cols.pct < 0) g.cols.pct = k;
        }
        for (k = gs; k <= ge && !g.name; k++) g.name = normClass(R2[k]) || normClass(R3[k]);
        if (!g.name) g.name = 'Group ' + (gi + 1);
        /* targets printed above the group's header (row 3): hours/day/ex, m³/hr, and m³ per excavator per day */
        for (k = gs; k <= ge; k++) {
          var tv = typeof R3[k] === 'number' ? R3[k] : null; if (tv == null) continue;
          if (k === g.cols.hrs) g.targets.hrs = tv; else if (k === g.cols.rate) g.targets.rate = tv; else if (g.targets.perEx == null) g.targets.perEx = tv;
        }
        var missing = ['hrs', 'rate', 'achieved'].filter(function (x) { return g.cols[x] < 0; });
        if (missing.length) issues.push({ level: 'warn', site: name, msg: name + ' ' + g.name + ': no "' + missing.join('", "') + '" column found in its block.' });
        return g;
      });
      // the same class can appear twice in a block (e.g. two target bases); make names unique
      var seen = {}; groups.forEach(function (g) { if (seen[g.name]) g.name += ' (' + (++seen[g.name]) + ')'; else seen[g.name] = 1; });

      sites.push({ name: name, start: start, stop: stop, groups: groups, siteCols: siteCols });
    });
    if (!sites.length) throw new ValidationError('No site blocks could be read. Check that row ' + (h - 1) + ' carries the site names above each "Date" column.');

    /* ---------- dates: one per row; a broken date cell borrows the date from the row's other blocks ---------- */
    var rowDate = {};
    for (r = h + 1; r < end; r++) {
      var row = aoa[r] || [], ds = {};
      sites.forEach(function (s) { var d = toISO(row[s.start]); if (d) ds[d] = (ds[d] || 0) + 1; });
      var best = null; Object.keys(ds).forEach(function (d) { if (!best || ds[d] > ds[best]) best = d; });
      if (best) rowDate[r] = best;
    }

    var out = sites.map(function (s) {
      var days = [];
      for (var r = h + 1; r < end; r++) {
        var row = aoa[r] || [], raw = row[s.start], d = toISO(raw);
        if (!d && rowDate[r] && raw != null && raw !== '') { issues.push({ level: 'warn', site: s.name, msg: s.name + ': date cell ' + cellRef(s.start, r) + ' reads "' + str(raw) + '"; used ' + rowDate[r] + ' from the same row in the other site blocks.' }); d = rowDate[r]; }
        if (!d && rowDate[r]) d = rowDate[r];
        if (!d) continue;
